
version: 2

updates:

  # Dépendances npm (celles de package.json / package-lock.json)
  
  - package-ecosystem: "npm"
    directory: "/"                  
    schedule:
      interval: "weekly"            
    open-pull-requests-limit: 5     
    commit-message:
      prefix: "deps"                
  - package-ecosystem: "github-actions"
    directory: "/"                  
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"