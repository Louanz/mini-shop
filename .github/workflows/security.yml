name: Pipeline de sécurité

on:
  push:
  pull_request:
  # demande de fusion
  

jobs:
  tests:

  # C’est un test automatique qui appelle la route GET /api/products de mon
  # application et vérifie qu’elle répond correctement. Il se trouve dans src/__tests__/example.test.t
    name: Suite de tests de sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  secrets: 
  # Un secret, c’est une information qui donne un accès ou un 
  # pouvoir à celui qui la possède : mot de passe, clé d’API, 
  # clé de signature. Si elle fuit, quelqu’un d’autre peut agir a ma place
    name: Scanner de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
            # Action officielle gitleaks 
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #jetons github pour que gitleaks puisse scanner le dépôt

  dependencies:
  #Le job dependencies vérifie qu’aucune n’a une faille de sécurité déjà connue

    name: Dépendances connues (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high